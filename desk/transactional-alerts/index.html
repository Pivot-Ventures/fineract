<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- api.js sends signed-out staff to the relative "login.html"; this keeps that at /login.html.
       Every link and asset on this page is absolute, so the base changes nothing else. -->
  <base href="/" />
  <title>Transactional alerts · Phaneroo SACCO</title>
  <link rel="stylesheet" href="/transactional-alerts/assets/alerts.css" />
</head>
<body>
<a class="skip-link" href="/transactional-alerts/#alerts-root">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Transactional alerts">
    <div class="sidebar-brand">
      <div class="brand-mark" aria-hidden="true">PS</div>
      <div class="brand-text"><strong>Phaneroo SACCO</strong><span>Transactional alerts</span></div>
    </div>
    <nav class="sidebar-nav" aria-label="Alerts">
      <a class="nav-link" data-view="templates" href="/transactional-alerts/#templates">Templates</a>
      <a class="nav-link" data-view="deliveries" href="/transactional-alerts/#deliveries">Delivery log</a>
      <a class="nav-link" data-view="test" href="/transactional-alerts/#test">Test send</a>
      <a class="nav-link" href="/dashboard.html">Back to Desk</a>
    </nav>
    <div class="sidebar-foot">
      <strong>Alerts service</strong>
      <span id="signed-in-as">Signed in with your Desk login</span>
      <div class="mw-chip" id="health-chip">● checking</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="mobile-toggle" type="button" data-toggle-sidebar aria-label="Open menu">☰</button>
      <h1 id="page-title">Templates</h1>
      <div class="topbar-right">
        <button type="button" class="btn btn-sm btn-ghost" id="refresh-btn">Refresh</button>
      </div>
    </header>
    <div id="status-bar" class="notice" role="status" hidden></div>
    <div class="content" id="alerts-root">Loading alerts…</div>
  </div>
</div>
<script src="/assets/api.js"></script>
<script src="/transactional-alerts/assets/alerts.js"></script>
</body>
</html>
