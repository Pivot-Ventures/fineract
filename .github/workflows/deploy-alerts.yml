# Pivot SACCO transactional alerts — Node service deploy.
# Ship path: merge to main, and this workflow rsyncs alerts/ and restarts
# pivot-sacco-alerts.service. Desk, Fineract, Caddy, nginx, and payments
# are left running. Provider keys stay in the host env file, never in git
# and never in this workflow.

name: Deploy SACCO Alerts

on:
  push:
    branches:
      - main
    paths:
      - "alerts/**"
      - ".github/workflows/deploy-alerts.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys so an in-progress sync finishes before the next one starts.
concurrency:
  group: deploy-sacco-alerts
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync alerts service
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Push filter is already main. This also keeps workflow_dispatch on other
    # branches from copying an unmerged tree to the droplet.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync alerts and restart systemd
        env:
          SACCO_DESK_HOST: ${{ secrets.SACCO_DESK_HOST }}
          SACCO_DESK_USER: ${{ secrets.SACCO_DESK_USER }}
          SACCO_DESK_SSH_KEY: ${{ secrets.SACCO_DESK_SSH_KEY }}
          SACCO_ALERTS_PATH: ${{ secrets.SACCO_ALERTS_PATH }}
          SACCO_ALERTS_ENV_FILE: ${{ secrets.SACCO_ALERTS_ENV_FILE }}
        shell: bash
        run: |
          # shellcheck shell=bash
          set -euo pipefail

          if [ -z "${SACCO_DESK_HOST}" ] || [ -z "${SACCO_DESK_USER}" ] || [ -z "${SACCO_DESK_SSH_KEY}" ]; then
            echo "SACCO_DESK_HOST, SACCO_DESK_USER, and SACCO_DESK_SSH_KEY must be set."
            exit 1
          fi

          trim() {
            local value="$1"
            value="${value//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          host="$(trim "${SACCO_DESK_HOST}")"
          remote_user="$(trim "${SACCO_DESK_USER}")"
          dest="$(trim "${SACCO_ALERTS_PATH:-/opt/pivot-sacco/alerts}")"
          env_file="$(trim "${SACCO_ALERTS_ENV_FILE:-/etc/pivot-sacco/alerts.env}")"
          if [ -z "${dest}" ]; then
            dest="/opt/pivot-sacco/alerts"
          fi
          if [ -z "${env_file}" ]; then
            env_file="/etc/pivot-sacco/alerts.env"
          fi
          dest="${dest%/}"

          if [ "${#host}" -gt 253 ] || [ "${#remote_user}" -gt 32 ] || [ "${#dest}" -gt 512 ] || [ "${#env_file}" -gt 512 ]; then
            echo "SACCO_DESK_HOST, SACCO_DESK_USER, SACCO_ALERTS_PATH, or SACCO_ALERTS_ENV_FILE is too long."
            exit 1
          fi
          if [[ ! "${host}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            && [[ ! "${host}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$ ]]; then
            echo "SACCO_DESK_HOST must be an IPv4 address or hostname."
            exit 1
          fi
          if [[ ! "${remote_user}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "SACCO_DESK_USER must be a simple account name."
            exit 1
          fi
          if [[ ! "${dest}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${dest}" == *..* ]] || [[ "${dest}" == *//* ]]; then
            echo "SACCO_ALERTS_PATH must be an absolute directory without '..'."
            exit 1
          fi
          if [[ ! "${env_file}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${env_file}" == *..* ]] || [[ "${env_file}" == *//* ]] || [[ "${env_file}" == */ ]]; then
            echo "SACCO_ALERTS_ENV_FILE must be an absolute file path without '..'."
            exit 1
          fi
          case "${dest}" in
            /|/bin|/sbin|/usr|/usr/*|/etc|/etc/*|/var|/home|/root|/opt|/opt/pivot-sacco)
              echo "SACCO_ALERTS_PATH ${dest} is too broad."
              exit 1
              ;;
            */desk|*/desk/*|*/payments|*/payments/*)
              echo "SACCO_ALERTS_PATH must not be the Desk or payments directory."
              exit 1
              ;;
          esac
          case "${env_file}" in
            "${dest}"|"${dest}"/*)
              echo "SACCO_ALERTS_ENV_FILE must be outside SACCO_ALERTS_PATH."
              exit 1
              ;;
          esac

          if [ ! -f alerts/server.js ] || [ ! -f alerts/package-lock.json ] || [ ! -f alerts/deploy/install-on-host.sh ]; then
            echo "alerts/ is missing from this checkout."
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          keyfile="${workdir}/id"
          known_hosts="${workdir}/known_hosts"
          umask 077
          # Secrets are usually real newlines. Also accept a one-line key with literal \n.
          printf '%s\n' "${SACCO_DESK_SSH_KEY}" | sed -e 's/\r$//' -e 's/\\n/\n/g' > "${keyfile}"
          chmod 600 "${keyfile}"
          if ! grep -q 'PRIVATE KEY' "${keyfile}"; then
            echo "SACCO_DESK_SSH_KEY does not look like a PEM or OpenSSH private key."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "${keyfile}" >/dev/null; then
            echo "SACCO_DESK_SSH_KEY could not be parsed. Use an unencrypted private key."
            exit 1
          fi

          # First-contact host key for this run. The address comes from SACCO_DESK_HOST.
          ssh-keyscan -T 15 -H "${host}" > "${known_hosts}" || true
          if [ ! -s "${known_hosts}" ]; then
            echo "Could not collect a host key. Check SACCO_DESK_HOST and SSH reachability from GitHub-hosted runners."
            exit 1
          fi
          chmod 644 "${known_hosts}"

          ssh_base=(
            ssh
            -i "${keyfile}"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts}"
            -o ConnectTimeout=20
            -o PasswordAuthentication=no
          )

          echo "Syncing alerts/ to ${remote_user}@${host}:${dest}/"
          dest_q="$(printf '%q' "${dest}")"
          "${ssh_base[@]}" \
            "${remote_user}@${host}" \
            "mkdir -p -- ${dest_q}/data"

          # Keep the JSON store and any env file that was left in the tree.
          # npm ci on the host refreshes node_modules. --delete drops removed
          # source files. Desk and payments are different directories and are
          # not touched. Do not restart Fineract, Caddy, or nginx.
          export RSYNC_RSH="ssh -i ${keyfile} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts} -o ConnectTimeout=20 -o PasswordAuthentication=no"
          rsync -azi --delete --stats --delay-updates --safe-links \
            --filter 'protect /data/***' \
            --filter 'protect /.env' \
            --filter 'protect /alerts.env' \
            --exclude '/data/' \
            --exclude '/.env' \
            --exclude '/alerts.env' \
            --exclude '/node_modules/' \
            --exclude '.git/' \
            alerts/ \
            "${remote_user}@${host}:${dest}/"

          echo "Installing production dependencies and restarting pivot-sacco-alerts.service"
          "${ssh_base[@]}" \
            "${remote_user}@${host}" \
            "bash -s -- $(printf '%q' "${dest}") $(printf '%q' "${env_file}") $(printf '%q' "${remote_user}")" \
            < alerts/deploy/install-on-host.sh

          echo "Alerts deploy finished. Fineract, Caddy, nginx, Desk, and payments were left running."
