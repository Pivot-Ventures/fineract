# Pivot SACCO transactional alerts — Node service deploy.
# Ship path: merge to main, and this workflow rsyncs alerts/ to
# <SACCO_ALERTS_PATH>/incoming, and install-on-host.sh builds a new release
# under <SACCO_ALERTS_PATH>/releases, switches the `current` symlink,
# restarts pivot-sacco-alerts.service, health-checks it, and rolls back on
# failure. Desk, Fineract, Caddy, nginx, and payments are left running.
# Provider keys stay in the host env file, never in git and never in this
# workflow.
#
# Required secrets: SACCO_DESK_HOST, SACCO_DESK_USER, SACCO_DESK_SSH_KEY,
# SACCO_DESK_KNOWN_HOSTS (pinned host key lines, e.g. from
# `ssh-keyscan -H <host>` run once from a trusted machine and verified
# against the droplet console fingerprint).
# Optional: SACCO_ALERTS_PATH (default /opt/pivot-sacco/alerts),
# SACCO_ALERTS_ENV_FILE (default /etc/pivot-sacco-alerts.env).

name: Deploy SACCO Alerts

on:
  push:
    branches:
      - main
    paths:
      - "alerts/**"
      - ".github/workflows/deploy-alerts.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys so an in-progress sync finishes before the next one starts.
concurrency:
  group: deploy-sacco-alerts
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync alerts service
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Push filter is already main. This also keeps workflow_dispatch on other
    # branches from copying an unmerged tree to the droplet.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync alerts and restart systemd
        env:
          SACCO_DESK_HOST: ${{ secrets.SACCO_DESK_HOST }}
          SACCO_DESK_USER: ${{ secrets.SACCO_DESK_USER }}
          SACCO_DESK_SSH_KEY: ${{ secrets.SACCO_DESK_SSH_KEY }}
          SACCO_DESK_KNOWN_HOSTS: ${{ secrets.SACCO_DESK_KNOWN_HOSTS }}
          SACCO_ALERTS_PATH: ${{ secrets.SACCO_ALERTS_PATH }}
          SACCO_ALERTS_ENV_FILE: ${{ secrets.SACCO_ALERTS_ENV_FILE }}
        shell: bash
        run: |
          # shellcheck shell=bash
          set -euo pipefail

          if [ -z "${SACCO_DESK_HOST}" ] || [ -z "${SACCO_DESK_USER}" ] || [ -z "${SACCO_DESK_SSH_KEY}" ]; then
            echo "SACCO_DESK_HOST, SACCO_DESK_USER, and SACCO_DESK_SSH_KEY must be set."
            exit 1
          fi
          if [ -z "${SACCO_DESK_KNOWN_HOSTS}" ]; then
            echo "SACCO_DESK_KNOWN_HOSTS must be set to the droplet's pinned SSH host key line(s)."
            echo "Generate it once from a trusted machine (ssh-keyscan -H <host>), verify the fingerprint against the droplet console, and store it as a repository secret."
            exit 1
          fi

          trim() {
            local value="$1"
            value="${value//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          host="$(trim "${SACCO_DESK_HOST}")"
          remote_user="$(trim "${SACCO_DESK_USER}")"
          dest="$(trim "${SACCO_ALERTS_PATH:-/opt/pivot-sacco/alerts}")"
          env_file="$(trim "${SACCO_ALERTS_ENV_FILE:-/etc/pivot-sacco-alerts.env}")"
          if [ -z "${dest}" ]; then
            dest="/opt/pivot-sacco/alerts"
          fi
          if [ -z "${env_file}" ]; then
            env_file="/etc/pivot-sacco-alerts.env"
          fi
          dest="${dest%/}"

          if [ "${#host}" -gt 253 ] || [ "${#remote_user}" -gt 32 ] || [ "${#dest}" -gt 512 ] || [ "${#env_file}" -gt 512 ]; then
            echo "SACCO_DESK_HOST, SACCO_DESK_USER, SACCO_ALERTS_PATH, or SACCO_ALERTS_ENV_FILE is too long."
            exit 1
          fi
          if [[ ! "${host}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            && [[ ! "${host}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$ ]]; then
            echo "SACCO_DESK_HOST must be an IPv4 address or hostname."
            exit 1
          fi
          if [[ ! "${remote_user}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "SACCO_DESK_USER must be a simple account name."
            exit 1
          fi
          if [[ ! "${dest}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${dest}" == *..* ]] || [[ "${dest}" == *//* ]]; then
            echo "SACCO_ALERTS_PATH must be an absolute directory without '..'."
            exit 1
          fi
          if [[ ! "${env_file}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${env_file}" == *..* ]] || [[ "${env_file}" == *//* ]] || [[ "${env_file}" == */ ]]; then
            echo "SACCO_ALERTS_ENV_FILE must be an absolute file path without '..'."
            exit 1
          fi
          case "${dest}" in
            /|/bin|/sbin|/usr|/usr/*|/etc|/etc/*|/var|/var/lib|/home|/home/*|/root|/root/*|/opt|/opt/pivot-sacco|/tmp|/tmp/*)
              echo "SACCO_ALERTS_PATH ${dest} is too broad or under a protected/home directory."
              exit 1
              ;;
            */desk|*/desk/*|*/payments|*/payments/*)
              echo "SACCO_ALERTS_PATH must not be the Desk or payments directory."
              exit 1
              ;;
          esac
          if [[ "${env_file}" != *.env ]]; then
            echo "SACCO_ALERTS_ENV_FILE must end in .env."
            exit 1
          fi
          case "${env_file}" in
            "${dest}"|"${dest}"/*)
              echo "SACCO_ALERTS_ENV_FILE must be outside SACCO_ALERTS_PATH."
              exit 1
              ;;
          esac

          if [ ! -f alerts/server.js ] || [ ! -f alerts/package-lock.json ] || [ ! -f alerts/deploy/install-on-host.sh ]; then
            echo "alerts/ is missing from this checkout."
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          keyfile="${workdir}/id"
          known_hosts="${workdir}/known_hosts"
          umask 077
          # Secrets are usually real newlines. Also accept a one-line key with literal \n.
          printf '%s\n' "${SACCO_DESK_SSH_KEY}" | sed -e 's/\r$//' -e 's/\\n/\n/g' > "${keyfile}"
          chmod 600 "${keyfile}"
          if ! grep -q 'PRIVATE KEY' "${keyfile}"; then
            echo "SACCO_DESK_SSH_KEY does not look like a PEM or OpenSSH private key."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "${keyfile}" >/dev/null; then
            echo "SACCO_DESK_SSH_KEY could not be parsed. Use an unencrypted private key."
            exit 1
          fi

          # Pinned host key from a secret. No ssh-keyscan: trusting whatever key
          # answers on each run would make StrictHostKeyChecking meaningless.
          printf '%s\n' "${SACCO_DESK_KNOWN_HOSTS}" | sed -e 's/\r$//' -e 's/\\n/\n/g' > "${known_hosts}"
          chmod 600 "${known_hosts}"
          if ! ssh-keygen -F "${host}" -f "${known_hosts}" >/dev/null; then
            echo "SACCO_DESK_KNOWN_HOSTS has no entry for SACCO_DESK_HOST. Add the host key line for that exact host name or IP."
            exit 1
          fi

          ssh_base=(
            ssh
            -i "${keyfile}"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts}"
            -o ConnectTimeout=20
            -o PasswordAuthentication=no
          )

          dest_q="$(printf '%q' "${dest}")"
          env_q="$(printf '%q' "${env_file}")"
          user_q="$(printf '%q' "${remote_user}")"

          echo "Preparing ${dest}/incoming on ${remote_user}@${host}"
          "${ssh_base[@]}" \
            "${remote_user}@${host}" \
            "bash -s -- --prepare ${dest_q} ${user_q}" \
            < alerts/deploy/install-on-host.sh

          # Upload into the staging directory only. Releases, the current
          # symlink, the data directory, and the env file are never touched by
          # rsync. Desk and payments are different directories.
          echo "Syncing alerts/ to ${remote_user}@${host}:${dest}/incoming/"
          export RSYNC_RSH="ssh -i ${keyfile} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts} -o ConnectTimeout=20 -o PasswordAuthentication=no"
          rsync -azi --delete --stats --delay-updates --safe-links \
            --exclude '/data/' \
            --exclude '/.env' \
            --exclude '/alerts.env' \
            --exclude '/node_modules/' \
            --exclude '.git/' \
            alerts/ \
            "${remote_user}@${host}:${dest}/incoming/"

          echo "Building release, switching current, restarting pivot-sacco-alerts.service"
          "${ssh_base[@]}" \
            "${remote_user}@${host}" \
            "bash -s -- ${dest_q} ${env_q} ${user_q}" \
            < alerts/deploy/install-on-host.sh

          echo "Alerts deploy finished. Fineract, Caddy, nginx, Desk, and payments were left running."
