# Phaneroo SACCO transactional alerts.
#
# Paste this inside the existing Desk server { } block. Do not replace the
# desk root, /fineract-provider/, or /payments/. Deploy SACCO Alerts does
# not copy this file into nginx and does not reload nginx.
#
# The header line is commented because an undefined $alerts_api_key makes
# nginx fail to start (and would take Desk down with it). Uncomment it only
# after you define the variable in the http block:
#
#     set $alerts_api_key "...";
#
# Use the same value as ALERTS_API_KEY in /etc/pivot-sacco/alerts.env.
# Do not commit the key.

location /alerts/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header X-Alerts-Key $alerts_api_key;
}
