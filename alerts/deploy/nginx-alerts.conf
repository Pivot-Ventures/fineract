# Phaneroo SACCO transactional alerts behind nginx.
#
# Deploy SACCO Alerts does not copy this file into nginx and does not
# reload nginx. Apply it by hand, then run `nginx -t` before reloading.
#
# Auth is done by the alerts service itself:
#   - Desk staff send X-Staff-Authorization: Basic <desk key>; the service
#     verifies it against Fineract. nginx passes it through untouched.
#   - The member gateway sends X-Alerts-Service-Key, but it talks to
#     127.0.0.1:8095 (or the backend network) directly, never through this
#     proxy. nginx therefore strips any client-supplied copy.
# nginx never injects a key. Do not add one here.
#
# ---------------------------------------------------------------------------
# Part 1 - paste into the http { } block (e.g. /etc/nginx/conf.d/alerts-zone.conf).
# The location below references this zone, so `nginx -t` fails until it
# exists. That is intentional: nginx refuses the reload instead of
# starting without rate limiting.
#
#     limit_req_zone $binary_remote_addr zone=pivot_alerts:10m rate=10r/s;
#
# ---------------------------------------------------------------------------
# Part 2 - paste inside the existing Desk server { } block. Do not replace
# the desk root, /fineract-provider/, or /payments/.

location /alerts/api/ {
    limit_req zone=pivot_alerts burst=20 nodelay;
    limit_req_status 429;

    client_max_body_size 64k;
    client_body_timeout 10s;

    # Trailing slash on proxy_pass strips the /alerts/api prefix:
    # /alerts/api/v1/health -> http://127.0.0.1:8095/v1/health
    proxy_pass http://127.0.0.1:8095/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, do not append: a client-supplied X-Forwarded-For is not trusted.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip internal-only credentials a client may try to forge. An empty
    # value makes nginx drop the header. X-Staff-Authorization is passed.
    proxy_set_header X-Alerts-Service-Key "";
    proxy_set_header X-Alerts-Key "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_redirect off;
}
